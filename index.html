<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calculadora">
    <div class="pantalla">
      <div id="operacion" class="operacion"></div>
      <div id="resultado" class="resultado">0</div>
    </div>

    <div class="botones">
      <button class="btn accion" data-accion="limpiar">AC</button>
      <button class="btn accion" data-accion="borrar">⌫</button>
      <button class="btn accion" data-accion="porcentaje">%</button>
      <button class="btn operador" data-operador="/">÷</button>

      <button class="btn" data-numero="7">7</button>
      <button class="btn" data-numero="8">8</button>
      <button class="btn" data-numero="9">9</button>
      <button class="btn operador" data-operador="*">×</button>

      <button class="btn" data-numero="4">4</button>
      <button class="btn" data-numero="5">5</button>
      <button class="btn" data-numero="6">6</button>
      <button class="btn operador" data-operador="-">−</button>

      <button class="btn" data-numero="1">1</button>
      <button class="btn" data-numero="2">2</button>
      <button class="btn" data-numero="3">3</button>
      <button class="btn operador" data-operador="+">+</button>

      <button class="btn cero" data-numero="0">0</button>
      <button class="btn" data-accion="decimal">.</button>
      <button class="btn igual" data-accion="igual">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
